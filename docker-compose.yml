name: ledger

x-api-image: &api-image
  image: ${REGISTRY:?set REGISTRY in deploy/.env}/ledger-api:${LEDGER_API_TAG:-${LEDGER_TAG:-latest}}

x-api-env: &api-env
  ConnectionStrings__Ledger: "Host=postgres;Port=5432;Database=${POSTGRES_DB:?set POSTGRES_DB in deploy/.env};Username=${POSTGRES_USER:?set POSTGRES_USER in deploy/.env};GSS Encryption Mode=Disable"
  PGPASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}"

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  web:
    image: ${REGISTRY}/ledger-web:${LEDGER_WEB_TAG:-${LEDGER_TAG:-latest}}
    restart: unless-stopped
    <<: *logging
    environment:
      NGINX_ENVSUBST_FILTER: "^LEDGER_"
      # The Zitadel instance the SPA signs in against: its discovery and token endpoints are fetched cross-origin.
      LEDGER_ZITADEL_ORIGIN: ${ZITADEL_ORIGIN:?set ZITADEL_ORIGIN in deploy/.env}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      edge:
        aliases:
          - ledger-web
      app:
    depends_on:
      api:
        condition: service_healthy

  migrate:
    <<: [*api-image, *logging]
    command: ["migrate"]
    restart: "no"
    env_file: .app.env
    environment:
      <<: *api-env
    networks:
      - app
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: [*api-image, *logging]
    restart: unless-stopped
    env_file: .app.env
    environment:
      <<: *api-env
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - edge
      - app
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    <<: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app

networks:
  edge:
    external: true
    name: ledger_edge
  app:

volumes:
  postgres_data:
